apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: neo4js.neo4j.com
spec:
  group: neo4j.com
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              version:
                type: string
              cluster:
                type: object
                properties:
                  mode:
                    type: string
                  size:
                    type: integer
              storage:
                type: object
                properties:
                  size:
                    type: string
  scope: Namespaced
  names:
    plural: neo4js
    singular: neo4j
    kind: Neo4j
    shortNames:
    - nj
