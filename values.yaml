image:
  repository: sweta037/neoj-operator
  tag: v1.0
  pullPolicy: Always

replicaCount: 1

serviceAccount:
  create: true
  name: neo4j-service-account

rbac:
  create: true

pvc:
  size: 10Gi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

service:
  name: neo4j-service
  type: ClusterIP
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687

neo4j:
  version: 4.4.0
  cluster:
    mode: causal
    size: 3
